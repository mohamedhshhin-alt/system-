<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة المدرس</title>
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#17213a;--muted:#6a7590;--line:#e4e8f1;
  --brand:#2447d6;--brand-2:#1a37a8;--brand-soft:#e9eeff;
  --ok:#0f9d6a;--ok-soft:#e1f6ee;--warn:#b97300;--warn-soft:#fff2d9;--bad:#d6393f;--bad-soft:#fde8e9;
  --side:#0e1a3a;
  --r:14px;--shadow:0 1px 2px rgba(20,30,60,.05),0 6px 20px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
a{color:var(--brand)}
.muted{color:var(--muted)}
.grow{flex:1}

#app{display:flex;min-height:100vh}
#side{width:248px;background:linear-gradient(180deg,var(--side),#0a1230);color:#cfd8f3;position:fixed;top:0;bottom:0;right:0;display:flex;flex-direction:column;padding:18px 14px;z-index:30;transition:transform .25s}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4a6bff,#2447d6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.b1{color:#fff;font-weight:700;line-height:1.25}
.b2{font-size:12.5px;color:#93a1cf}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;color:#b9c4e8;text-decoration:none;cursor:pointer;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#93a1cf}
#saveInd{display:flex;align-items:center;gap:6px}
#saveInd:before{content:"";width:8px;height:8px;border-radius:50%;background:#34d399}

main{margin-right:248px;flex:1;min-width:0}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 26px;background:rgba(243,245,250,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#top h1{font-size:20px}
#top .burger{display:none}
.gsearch{position:relative;width:260px}
.gsearch input{width:100%;padding:9px 38px 9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.gsearch svg{position:absolute;right:11px;top:10px;color:var(--muted)}
.today{color:var(--muted);font-size:13.5px;white-space:nowrap}
#view{padding:22px 26px 60px;max-width:1400px}
.demo-bar{background:linear-gradient(90deg,#fff7e0,#fff2cc);color:#7a5200;padding:9px 26px;font-size:14px;border-bottom:1px solid #f3dfa0}
.demo-bar a{cursor:pointer;font-weight:600}
.bk-bar{background:var(--warn-soft);color:#7a5200;padding:9px 26px;font-size:14px;border-bottom:1px solid #f3dfa0}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.cols .card{margin-bottom:0}
.cols2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.cols2 .card{margin-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat .n{font-size:24px;font-weight:700;line-height:1.2}
.stat .l{color:var(--muted);font-size:13.5px}
.ic.b{background:var(--brand-soft);color:var(--brand)}.ic.g{background:var(--ok-soft);color:var(--ok)}.ic.o{background:var(--warn-soft);color:var(--warn)}.ic.r{background:var(--bad-soft);color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar .inp,.bar select{width:auto;min-width:150px}
.bar .sw{flex:1;min-width:200px;position:relative}
.bar .sw input{width:100%;padding-right:36px}
.bar .sw svg{position:absolute;right:11px;top:10px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--brand);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f6f8fc}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#0b7f55}
.btn.danger{background:var(--bad)}.btn.danger:hover{background:#b82c32}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:9px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;text-decoration:none;padding:0}
.icon-btn:hover{color:var(--brand);border-color:#c8d3f5;background:var(--brand-soft)}
.icon-btn.del:hover{color:var(--bad);border-color:#f3c3c5;background:var(--bad-soft)}
.icon-btn.wa:hover{color:var(--ok);border-color:#b8e6d3;background:var(--ok-soft)}
.acts{display:flex;gap:6px;justify-content:flex-end}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:#f7f9fd;color:var(--muted);font-weight:600;font-size:13px;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#fafbff}
td.num,th.num{text-align:center}
.nm{font-weight:600}
.sub{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.mut{background:#eef1f7;color:var(--muted)}.chip.br{background:var(--brand-soft);color:var(--brand)}

.inp,select.inp,textarea.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,71,214,.12)}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 11px;border-radius:99px;cursor:pointer;font-size:14px}
.days input:checked+span{color:var(--brand);font-weight:700}
.days label:has(input:checked){background:var(--brand-soft);border-color:#b9c7f5}

.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px}
.pgs{display:flex;gap:5px;flex-wrap:wrap}
.pg{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}
.pg.cur{background:var(--brand);color:#fff;border-color:var(--brand)}
.pg:disabled{opacity:.4;cursor:default}
.dots{align-self:center;color:var(--muted)}
#list{scroll-margin-top:80px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 15px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.p{background:var(--ok);color:#fff}
.seg button.on.l{background:#d99a00;color:#fff}
.seg button.on.a{background:var(--bad);color:#fff}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.sumrow .chip{font-size:14px;padding:5px 14px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.kv{display:flex;gap:18px;flex-wrap:wrap;background:#f7f9fd;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.kv b{color:var(--ink)}
.prog{height:9px;background:#e8ecf5;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.list-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{min-width:0}
.chart{width:100%;height:auto;display:block}
.score{width:90px;text-align:center}
.score.over{border-color:var(--bad)}
.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mini-stats div{background:#f7f9fd;border-radius:12px;padding:10px 12px;text-align:center}
.mini-stats b{display:block;font-size:20px}
.mini-stats span{font-size:12.5px;color:var(--muted)}
h4.sec{font-size:14px;margin:16px 0 8px;color:var(--muted)}

.ovl{position:fixed;inset:0;background:rgba(10,18,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(820px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:17px}
.mb{padding:18px 20px;overflow:auto}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#17213a;color:#fff;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:200;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}
#toast.ok{background:#0b7f55}

@media(max-width:900px){
  #side{transform:translateX(100%)}
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  main{margin-right:0}
  #top .burger{display:inline-grid}
  #top{padding:10px 14px}
  #view{padding:16px 14px 60px}
  .gsearch{display:none}
  .today{display:none}
  .cols2{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .demo-bar,.bk-bar{padding:9px 14px}
}
@media print{
  #side,#top,.no-print,.demo-bar,.bk-bar,#toast{display:none!important}
  main{margin:0!important}
  body{background:#fff}
  .card,.stat{box-shadow:none;border:1px solid #ddd}
  #view{padding:0}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="logo" id="bLogo">م</div><div><div class="b1" id="bName"></div><div class="b2" id="bSub"></div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div id="saveInd">البيانات محفوظة</div></div>
  </aside>
  <main>
    <header id="top">
      <button class="icon-btn burger" data-act="burger" aria-label="القائمة"></button>
      <h1 id="pageTitle"></h1>
      <div class="grow"></div>
      <div class="gsearch"><input id="gs" placeholder="ابحث عن طالب بالاسم أو الرقم..."></div>
      <div class="today" id="todayLbl"></div>
    </header>
    <div id="banner"></div>
    <section id="view"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>
<noscript>يلزم تفعيل JavaScript لتشغيل النظام.</noscript>

<script>
'use strict';
/* ============ أدوات عامة ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const money=n=>fmt(n)+' ج';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const curMonth=()=>todayStr().slice(0,7);
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WEEK_ORDER=[6,0,1,2,3,4,5];
const addMonths=(m,n)=>{let [y,mo]=m.split('-').map(Number);mo+=n-1;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)};
const monthLabel=m=>{const [y,mo]=m.split('-');return MONTHS[+mo-1]+' '+y};
const dateLabel=s=>{const d=parseD(s);return DAYS[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const fmtTime=t=>{if(!t)return'';let [h,m]=t.split(':').map(Number);const ap=h>=12?'م':'ص';h=h%12||12;return h+':'+pad(m)+' '+ap};
const daysLabel=days=>WEEK_ORDER.filter(d=>(days||[]).includes(d)).map(d=>DAYS[d]).join(' و ');
const AR_DIG='٠١٢٣٤٥٦٧٨٩';
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[٠-٩]/g,c=>AR_DIG.indexOf(c)).replace(/[ً-ٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
const COL=new Intl.Collator('ar');
const ltr=x=>'<bdi>'+x+'</bdi>';
const csvCell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

function download(name,text,type){
  const b=new Blob([text],{type:type||'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);
}
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='show '+(kind||'ok');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},2600)}

const ICONS={
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  students:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14c2.4 0 4 1.6 4 4.5"/>',
  groups:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  attendance:'<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8.5 13l2.5 2.5 4.5-5"/>',
  payments:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>',
  grades:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/>',
  settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  upload:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
  print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7L4 20z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2"/><path d="M3 10h18"/>',
  alert:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.01"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'
};
const ico=(n,s)=>'<svg width="'+(s||18)+'" height="'+(s||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ============ قاعدة البيانات ============ */
const KEY='teacher_mgmt_v1';
let DB=loadDB();
let IDX=null,saveT=null;

function emptyDB(){return{v:1,nextId:1,settings:{teacher:'الأستاذ',center:'اسم السنتر',demo:false,lastBackup:''},groups:[],students:[],attendance:{},payments:[],exams:[]}}
function loadDB(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const d=JSON.parse(r);return fixDB(d)}
  }catch(e){}
  return seedDB();
}
function fixDB(d){
  const e=emptyDB();
  d=d||{};
  d.settings=Object.assign(e.settings,d.settings||{});
  ['groups','students','payments','exams'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.attendance||typeof d.attendance!=='object')d.attendance={};
  if(!d.nextId){let m=0;[d.groups,d.students,d.payments,d.exams].forEach(a=>a.forEach(x=>{if(x.id>m)m=x.id}));d.nextId=m+1}
  d.v=1;return d;
}
function uid(){return DB.nextId++}
function ind(t){const e=$('#saveInd');if(e)e.textContent=t}
function touch(){
  IDX=null;clearTimeout(saveT);ind('جارٍ الحفظ...');
  saveT=setTimeout(flush,300);
}
function flush(){
  clearTimeout(saveT);saveT=null;
  try{localStorage.setItem(KEY,JSON.stringify(DB));ind('تم الحفظ ✓')}
  catch(e){ind('لم يتم الحفظ');toast('تعذّر الحفظ في المتصفح. حمّل نسخة احتياطية الآن من صفحة الإعدادات','bad')}
}
window.addEventListener('beforeunload',()=>{if(saveT)flush()});

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function seedDB(){
  const R=rng(20261023);
  const pick=a=>a[Math.floor(R()*a.length)];
  const rint=(a,b)=>a+Math.floor(R()*(b-a+1));
  const male=['محمد','أحمد','محمود','مصطفى','عمر','يوسف','علي','حسن','حسين','إبراهيم','خالد','كريم','طارق','هاني','عمرو','ياسر','أسامة','سعيد','إسلام','مازن','زياد','آدم','مالك','بلال','عبد الرحمن','أيمن','وليد','شريف','رامي','مروان','سيف','تامر','فارس','عبد الله','رضا','ماجد','صلاح','ممدوح','جمال','سامح'];
  const female=['فاطمة','مريم','سارة','نور','هدى','منى','ياسمين','آية','إيمان','رنا','دينا','ليلى','جنى','سلمى','حبيبة','هبة','نادين','ملك','رودينا','شهد','أسماء','بسملة','تقى','روان','ندى','هنا','جميلة','بسنت','مي','داليا'];
  const db=emptyDB();
  db.settings={teacher:'الأستاذ / محمد',center:'سنتر النور التعليمي',demo:true,lastBackup:''};
  const now=new Date();
  const grades=[{n:'الأول الثانوي',fee:200},{n:'الثاني الثانوي',fee:220},{n:'الثالث الثانوي',fee:250},{n:'الثالث الإعدادي',fee:180}];
  const combos=[[6,2],[0,3],[1,4]];
  const times=['16:00','18:30'];
  const letters=['أ','ب','ج','د','هـ','و'];
  grades.forEach(gr=>{for(let i=0;i<6;i++){
    db.groups.push({id:db.nextId++,name:gr.n+' - مجموعة '+letters[i],grade:'الصف '+gr.n,days:combos[i%3],time:times[Math.floor(i/3)],fee:gr.fee});
  }});
  const gm=new Map(db.groups.map(g=>[g.id,g]));
  const abil=[],tend=[];
  for(let i=0;i<1000;i++){
    const g=db.groups[i%db.groups.length];
    const first=R()<0.55?pick(male):pick(female);
    const name=first+' '+pick(male)+' '+pick(male);
    const mk=()=>'01'+pick(['0','1','2','5'])+String(rint(0,99999999)).padStart(8,'0');
    const join=ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-rint(5,240)));
    db.students.push({id:db.nextId++,code:1001+i,name,gid:g.id,phone:R()<0.85?mk():'',parent:mk(),join,notes:'',fee:null});
    abil.push(0.45+R()*0.5);
    const r=R();tend.push(r<0.04?0.55:(r<0.2?0.85:0.97));
  }
  db.groups.forEach(g=>{
    const sts=db.students.filter(s=>s.gid===g.id);let found=0;
    for(let back=1;back<80&&found<6;back++){
      const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-back);
      if(!g.days.includes(dt.getDay()))continue;
      found++;const ds=ymd(dt),map={};
      sts.forEach(s=>{if(s.join>ds)return;const r=R();map[s.id]=r<tend[s.code-1001]?(R()<0.07?'l':'p'):'a'});
      db.attendance[g.id+'|'+ds]=map;
    }
    [['امتحان شهري',50,-35],['اختبار قصير',20,-9]].forEach(([title,max,off])=>{
      const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+off),scores={};
      sts.forEach(s=>{if(R()<0.04)return;const v=Math.max(0,Math.min(1,abil[s.code-1001]+(R()-0.5)*0.3));scores[s.id]=Math.round(v*max*2)/2});
      db.exams.push({id:db.nextId++,gid:g.id,title,date:ymd(dt),max,scores});
    });
  });
  const cm=curMonth(),months=[-5,-4,-3,-2,-1,0].map(n=>addMonths(cm,n)),probs=[0.93,0.94,0.93,0.94,0.9,0.55];
  db.students.forEach(s=>{
    const g=gm.get(s.gid);
    months.forEach((m,k)=>{
      if(s.join.slice(0,7)>m)return;
      if(R()<probs[k]){
        let amt=g.fee;if(k===5&&R()<0.08)amt=Math.round(g.fee/2);
        const dmax=m===cm?Math.max(1,now.getDate()):28;
        db.payments.push({id:db.nextId++,sid:s.id,month:m,amount:amt,date:m+'-'+pad(rint(1,dmax)),note:''});
      }
    });
  });
  return db;
}

function idx(){
  if(IDX)return IDX;
  const sorted=DB.students.slice().sort((a,b)=>COL.compare(a.name,b.name));
  const g=new Map(DB.groups.map(x=>[x.id,x]));
  const s=new Map(DB.students.map(x=>[x.id,x]));
  const byGroup=new Map();DB.groups.forEach(x=>byGroup.set(x.id,[]));
  sorted.forEach(x=>{if(!byGroup.has(x.gid))byGroup.set(x.gid,[]);byGroup.get(x.gid).push(x)});
  const pay=new Map(),payList=new Map();
  DB.payments.forEach(p=>{const k=p.sid+'|'+p.month;pay.set(k,(pay.get(k)||0)+p.amount);if(!payList.has(k))payList.set(k,[]);payList.get(k).push(p)});
  const sess=new Map();
  for(const k in DB.attendance){const i=k.indexOf('|');const gid=+k.slice(0,i);if(!sess.has(gid))sess.set(gid,[]);sess.get(gid).push({date:k.slice(i+1),map:DB.attendance[k]})}
  sess.forEach(a=>a.sort((x,y)=>y.date.localeCompare(x.date)));
  IDX={sorted,g,s,byGroup,pay,payList,sess};return IDX;
}
function feeOf(s){if(s.fee!==null&&s.fee!==undefined&&s.fee!=='')return +s.fee;const g=idx().g.get(s.gid);return g?g.fee:0}
function paidOf(s,m){return idx().pay.get(s.id+'|'+m)||0}
function payStatus(s,m){
  if(s.join&&s.join.slice(0,7)>m)return'na';
  const fee=feeOf(s),p=paidOf(s,m);
  if(p>=fee)return'paid';
  return p>0?'part':'unpaid';
}
function stChip(st){return({paid:'<span class="chip ok">مسدد</span>',part:'<span class="chip warn">جزئي</span>',unpaid:'<span class="chip bad">لم يسدد</span>',na:'<span class="chip mut">غير مطلوب</span>'})[st]}
function attStats(s){
  const ss=idx().sess.get(s.gid)||[];let tot=0,pres=0,abs=0,late=0;
  ss.forEach(x=>{const c=x.map[s.id];if(!c)return;tot++;if(c==='a')abs++;else{pres++;if(c==='l')late++}});
  return{tot,pres,abs,late,rate:tot?Math.round(pres/tot*100):null};
}
function recentAbs(s,n){const ss=(idx().sess.get(s.gid)||[]).slice(0,n||4);return ss.filter(x=>x.map[s.id]==='a').length}
function gName(id){const g=idx().g.get(id);return g?g.name:'—'}
function contactOf(s){return s.parent||s.phone||''}
function waLink(phone,msg){
  let n=String(phone||'').replace(/\D/g,'');if(!n)return'';
  if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n='20'+n.slice(1);
  return'https://wa.me/'+n+'?text='+encodeURIComponent(msg);
}
function waBtn(phone,msg,title){
  const l=waLink(phone,msg);
  return l?'<a class="icon-btn wa" href="'+esc(l)+'" target="_blank" rel="noopener" title="'+esc(title||'واتساب')+'">'+ico('wa',16)+'</a>':'';
}
function empty(msg){return'<div class="empty">'+ico('search',28)+'<div style="margin-top:8px">'+msg+'</div></div>'}
function pager(k,total,page,size){
  const pages=Math.max(1,Math.ceil(total/size));
  if(total<=size)return'<div class="pager"><span class="muted">'+fmt(total)+' نتيجة</span></div>';
  page=Math.min(page,pages);
  const btn=(p,l,dis,cur)=>'<button class="pg'+(cur?' cur':'')+'" '+(dis?'disabled ':'')+'data-act="pg" data-k="'+k+'" data-p="'+p+'">'+l+'</button>';
  let b=btn(page-1,'السابق',page<=1);
  const set=new Set([1,pages,page,page-1,page+1,page-2,page+2].filter(p=>p>=1&&p<=pages));
  let prev=0;[...set].sort((a,b)=>a-b).forEach(p=>{if(p-prev>1)b+='<span class="dots">…</span>';b+=btn(p,p,false,p===page);prev=p});
  b+=btn(page+1,'التالي',page>=pages);
  return'<div class="pager"><span class="muted">'+fmt(total)+' نتيجة · صفحة '+page+' من '+pages+'</span><div class="pgs">'+b+'</div></div>';
}

function barChart(data){
  const W=560,H=215,pl=10,pr=10,pt=26,pb=34;
  const max=Math.max(1,...data.map(d=>d.value));const bw=(W-pl-pr)/data.length;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="التحصيل الشهري">';
  for(let i=0;i<=3;i++){const y=pt+(H-pt-pb)*(1-i/3);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#e8ecf5"/>'}
  data.forEach((d,i)=>{
    const h=(H-pt-pb)*d.value/max,x=pl+i*bw+bw*0.2,w=bw*0.6,y=H-pb-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,1)+'" rx="6" fill="'+(i===data.length-1?'#2447d6':'#b9c7f5')+'"/>';
    s+='<text x="'+(x+w/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#17213a">'+fmt(d.value)+'</text>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="12.5" fill="#6a7590">'+esc(d.label)+'</text>';
  });
  return s+'</svg>';
}

   (exams.length?'<select class="inp" data-chg="grE" style="min-width:220px">'+exams.map(e=>'<option value="'+e.id+'"'+(e.id===U.eid?' selected':'')+'>'+esc(e.title)+' — '+esc(e.date)+'</option>').join('')+'</select>':'')+
   '<button class="btn" data-act="exNew">'+ico('plus',17)+'امتحان جديد</button>'+
   (exams.length?'<button class="btn ghost" data-act="exEdit">'+ico('edit',16)+'تعديل</button><button class="btn ghost" data-act="exDel" style="color:var(--bad)">'+ico('trash',16)+'حذف الامتحان</button>':'')+
  '</div></div><div id="grBody"></div>';
  renderGr();
}
function examStats(e,sts){
  const v=[];sts.forEach(s=>{const x=e.scores[s.id];if(x!==undefined)v.push(x)});
  if(!v.length)return{n:0};
  const sum=v.reduce((a,b)=>a+b,0);
  return{n:v.length,avg:sum/v.length,max:Math.max(...v),min:Math.min(...v),pass:v.filter(x=>x/e.max>=0.5).length};
}
function grStatsHtml(e,sts){
  const t=examStats(e,sts);
  if(!t.n)return'<div class="stats"><div class="stat"><div class="ic o">'+ico('grades',24)+'</div><div><div class="n">'+ltr('0 / '+sts.length)+'</div><div class="l">لم تُسجل درجات بعد</div></div></div></div>';
  const r1=x=>Math.round(x*10)/10;
  return'<div class="stats">'+
   '<div class="stat"><div class="ic b">'+ico('trend',24)+'</div><div><div class="n">'+ltr(r1(t.avg)+' <span class="sub">/ '+e.max+'</span>')+'</div><div class="l">متوسط المجموعة</div></div></div>'+
   '<div class="stat"><div class="ic g">'+ico('grades',24)+'</div><div><div class="n">'+t.max+'</div><div class="l">أعلى درجة</div></div></div>'+
   '<div class="stat"><div class="ic r">'+ico('alert',24)+'</div><div><div class="n">'+t.min+'</div><div class="l">أقل درجة</div></div></div>'+
   '<div class="stat"><div class="ic o">'+ico('check',24)+'</div><div><div class="n">'+ltr(Math.round(t.pass/t.n*100)+'%')+'</div><div class="l">نسبة النجاح ('+t.n+' من '+sts.length+' امتحنوا)</div></div></div></div>';
}
function grTopHtml(e,sts){
  const arr=sts.filter(s=>e.scores[s.id]!==undefined).sort((a,b)=>e.scores[b.id]-e.scores[a.id]).slice(0,5);
  if(!arr.length)return'';
  return'<h3>الأوائل</h3>'+arr.map((s,i)=>'<div class="list-row"><span class="chip br">'+(i+1)+'</span><div class="grow nm">'+esc(s.name)+'</div><b>'+ltr(e.scores[s.id]+' / '+e.max)+'</b></div>').join('');
}
function renderGr(){
  const U=UI.gr,box=$('#grBody');if(!box)return;
  const e=curExam(),sts=idx().byGroup.get(U.gid)||[];
  if(!e||e.gid!==U.gid){box.innerHTML='<div class="card">'+empty('مفيش امتحانات للمجموعة دي. اضغط "امتحان جديد"')+'</div>';return}
  box.innerHTML='<div id="grStats">'+grStatsHtml(e,sts)+'</div><div class="cols2"><div class="card"><h3>'+esc(e.title)+' — الدرجة النهائية '+e.max+'</h3>'+
   (sts.length?'<div class="tbl-wrap"><table style="min-width:480px"><thead><tr><th class="num" style="width:50px">#</th><th>الطالب</th><th class="num">الدرجة</th><th class="num">النسبة</th></tr></thead><tbody>'+
    sts.map((s,i)=>{const v=e.scores[s.id];return'<tr><td class="num sub">'+(i+1)+'</td><td class="nm">'+esc(s.name)+'</td><td class="num"><input class="inp score" type="number" step="0.5" min="0" max="'+e.max+'" data-score="'+s.id+'" value="'+(v===undefined?'':v)+'"></td><td class="num pct">'+pctChip(v,e.max)+'</td></tr>'}).join('')+'</tbody></table></div>':empty('مفيش طلاب في المجموعة'))+'</div>'+
   '<div class="card" id="grTop">'+grTopHtml(e,sts)+'</div></div>';
}
function pctChip(v,max){if(v===undefined||v===null||v==='')return'<span class="chip mut">—</span>';const p=Math.round(v/max*100);return'<span class="chip '+(p>=85?'ok':p>=50?'br':'bad')+'">'+ltr(p+'%')+'</span>'}
function examForm(id){
  const e=id?DB.exams.find(x=>x.id===id):null;
  modal(e?'تعديل الامتحان':'امتحان جديد',
   '<form id="fEx" data-form="exam" data-id="'+(id||'')+'" class="grid2">'+
    fld('اسم الامتحان *','<input class="inp" name="title" required value="'+esc(e?e.title:'')+'" placeholder="مثال: امتحان شهر أكتوبر">','full')+
    fld('التاريخ','<input class="inp" type="date" name="date" value="'+esc(e?e.date:todayStr())+'">')+
    fld('الدرجة النهائية *','<input class="inp" type="number" min="1" name="max" required value="'+(e?e.max:20)+'">')+'</form>',
   {foot:'<button class="btn" type="submit" form="fEx">حفظ</button><button class="btn ghost" data-act="closeModal">إلغاء</button>'});
}

/* ---------- الإعدادات ---------- */
function vSettings(el){
  const kb=Math.round(JSON.stringify(DB).length/1024),lb=DB.settings.lastBackup;
  el.innerHTML='<div class="cols">'+
   '<div class="card"><h3>بيانات السنتر</h3><form data-form="settings" class="grid2">'+
    fld('اسم السنتر','<input class="inp" name="center" value="'+esc(DB.settings.center)+'">','full')+
    fld('اسم المدرس (يظهر في رسائل الواتساب)','<input class="inp" name="teacher" value="'+esc(DB.settings.teacher)+'">','full')+
    '<div class="full"><button class="btn" type="submit">حفظ</button></div></form></div>'+
   '<div class="card"><h3>النسخ الاحتياطي</h3><p class="muted" style="margin-top:0">البيانات محفوظة داخل المتصفح على الجهاز ده. حمّل نسخة احتياطية كل أسبوع واحتفظ بيها في مكان تاني (واتساب لنفسك أو فلاشة أو Google Drive).</p>'+
    '<div class="kv"><span>حجم البيانات <b>'+kb+' ك.ب</b></span><span>آخر نسخة <b>'+(lb?esc(lb):'لم تُحمّل بعد')+'</b></span></div>'+
    '<div class="bar"><button class="btn" data-act="bkExport">'+ico('download',17)+'تحميل نسخة احتياطية</button><button class="btn ghost" data-act="bkImport">'+ico('upload',17)+'استرجاع نسخة</button><input type="file" id="impFile" accept=".json,application/json" hidden data-chg="impFile"></div></div>'+
   '<div class="card"><h3>إدارة البيانات</h3><div class="bar" style="flex-direction:column;align-items:stretch">'+
    '<button class="btn ghost" data-act="stuCsv">'+ico('download',17)+'تصدير الطلاب إلى Excel</button>'+
    '<button class="btn ghost" data-act="resetDemo">إعادة تحميل البيانات التجريبية (1000 طالب)</button>'+
    '<button class="btn danger" data-act="clearAll">'+ico('trash',17)+'مسح كل البيانات وبدء نظام فاضي</button></div></div></div>';
}

/* ============ الأحداث ============ */
const ACT={
  burger(){$('#side').classList.toggle('open')},
  nav(d){go(d.v)},
  closeModal(){closeModal()},
  confirmYes(){const f=PENDING;PENDING=null;closeModal();if(f)f()},
  print(){window.print()},
  pg(d){UI[d.k].page=+d.p;LIST[d.k]();const l=$('#list');if(l)l.scrollIntoView({behavior:'smooth',block:'start'})},
  goAtt(d){UI.att.gid=+d.gid;UI.att.date=todayStr();go('attendance')},
  goPay(d){UI.pay.month=d.m;UI.pay.st='';UI.pay.page=1;go('payments')},
  goSettings(){go('settings')},
  stuNew(){studentForm(0)},
  stuEdit(d){studentForm(+d.id)},
  stuView(d){profileModal(+d.id)},
  stuDel(d){const s=idx().s.get(+d.id);confirmBox('هتحذف الطالب <b>'+esc(s.name)+'</b> وكل مدفوعاته وحضوره ودرجاته. مش هينفع ترجعه بعد كده.',()=>{deleteStudent(s.id);toast('تم حذف الطالب');refresh()},'حذف')},
  stuCsv(){studentsCsv()},
  grpNew(){groupForm(0)},
  grpEdit(d){groupForm(+d.id)},
  grpDel(d){
    const g=idx().g.get(+d.id),n=(idx().byGroup.get(g.id)||[]).length;
    if(n){toast('المجموعة فيها '+n+' طالب. انقلهم لمجموعة تانية الأول','bad');return}
    confirmBox('حذف المجموعة <b>'+esc(g.name)+'</b>؟',()=>{
      DB.groups=DB.groups.filter(x=>x.id!==g.id);
      for(const k in DB.attendance){if(k.startsWith(g.id+'|'))delete DB.attendance[k]}
      DB.exams=DB.exams.filter(e=>e.gid!==g.id);touch();toast('تم حذف المجموعة');refresh();
    },'حذف');
  },
  mark(d){
    const key=UI.att.gid+'|'+UI.att.date;let m=DB.attendance[key];if(!m)m=DB.attendance[key]={};
    if(m[d.sid]===d.c)delete m[d.sid];else m[d.sid]=d.c;
    if(!Object.keys(m).length)delete DB.attendance[key];
    touch();renderAtt();
  },
  attAll(){
    const key=UI.att.gid+'|'+UI.att.date,m={};
    (idx().byGroup.get(UI.att.gid)||[]).forEach(s=>{m[s.id]='p'});
    if(Object.keys(m).length)DB.attendance[key]=m;touch();renderAtt();toast('تم تسجيل الكل حاضر');
  },
  attClear(){
    const key=UI.att.gid+'|'+UI.att.date;
    if(!DB.attendance[key])return;
    confirmBox('مسح تسجيل الحضور لهذا اليوم؟',()=>{delete DB.attendance[key];touch();renderAtt()},'مسح');
  },
  attDate(d){UI.att.date=d.d;refresh();window.scrollTo(0,0)},
  payModal(d){payModal(+d.sid,d.m||UI.pay.month)},
  quickPay(d){
    const s=idx().s.get(+d.sid),m=UI.pay.month,rem=feeOf(s)-paidOf(s,m);
    if(rem<=0)return;addPayment(s.id,m,rem,todayStr(),'');toast('تم تسجيل سداد '+s.name);listPay();
  },
  payDel(d){
    DB.payments=DB.payments.filter(p=>p.id!==+d.id);touch();toast('تم حذف الدفعة');
    payModal(+d.sid,d.m);if(currentName()==='payments')listPay();else if(currentName()==='dashboard')vDashboard($('#view'));
  },
  payCsv(){paymentsCsv()},
  exNew(){examForm(0)},
  exEdit(){if(UI.gr.eid)examForm(UI.gr.eid)},
  exDel(){const e=curExam();if(!e)return;confirmBox('حذف امتحان <b>'+esc(e.title)+'</b> بكل درجاته؟',()=>{DB.exams=DB.exams.filter(x=>x.id!==e.id);UI.gr.eid=0;touch();refresh()},'حذف')},
  bkExport(){
    DB.settings.lastBackup=todayStr();touch();flush();
    download('backup-'+todayStr()+'.json',JSON.stringify(DB),'application/json');
    toast('تم تحميل النسخة الاحتياطية');refresh();banner();
  },
  bkImport(){$('#impFile').click()},
  resetDemo(){confirmBox('هيتم استبدال كل بياناتك الحالية ببيانات تجريبية.',()=>{DB=seedDB();touch();flush();toast('تم تحميل البيانات التجريبية');render()},'استبدال')},
  clearAll(){confirmBox('هيتم مسح <b>كل</b> الطلاب والمجموعات والمدفوعات والحضور نهائياً. تأكد إنك حمّلت نسخة احتياطية.',()=>{DB=emptyDB();touch();flush();toast('تم مسح البيانات. النظام جاهز للاستخدام');render()},'مسح كل شيء')}
};
const CHG={
  stG(t){UI.students.gid=+t.value;UI.students.page=1;listStudents()},
  stP(t){UI.students.pay=t.value;UI.students.page=1;listStudents()},
  attG(t){UI.att.gid=+t.value;renderAtt()},
  attD(t){if(t.value){UI.att.date=t.value;renderAtt()}},
  payM(t){if(t.value){UI.pay.month=t.value;UI.pay.page=1;listPay()}},
  payG(t){UI.pay.gid=+t.value;UI.pay.page=1;listPay()},
  payS(t){UI.pay.st=t.value;UI.pay.page=1;listPay()},
  grG(t){UI.gr.gid=+t.value;UI.gr.eid=0;refresh()},
  grE(t){UI.gr.eid=+t.value;renderGr()},
  impFile(t){
    const f=t.files&&t.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.students)||!Array.isArray(d.groups))throw new Error('bad');
        confirmBox('هيتم استبدال بياناتك الحالية بالنسخة دي ('+fmt(d.students.length)+' طالب).',()=>{DB=fixDB(d);touch();flush();toast('تم استرجاع النسخة');render()},'استرجاع');
      }catch(e){toast('الملف ده مش نسخة احتياطية صحيحة','bad')}
      t.value='';
    };
    r.readAsText(f);
  }
};
let inpT=null;
const INP={
  stQ(t){UI.students.q=t.value;UI.students.page=1;listStudents()},
  payQ(t){UI.pay.q=t.value;UI.pay.page=1;listPay()}
};
const FORMS={
  student(f){
    const v=Object.fromEntries(new FormData(f)),id=+f.dataset.id;
    if(!v.name.trim()){toast('اكتب اسم الطالب','bad');return}
    const rec={name:v.name.trim(),gid:+v.gid,join:v.join||todayStr(),phone:v.phone.trim(),parent:v.parent.trim(),notes:v.notes.trim(),fee:v.fee===''?null:+v.fee};
    if(id){Object.assign(idx().s.get(id),rec);toast('تم تحديث بيانات الطالب')}
    else{let mx=1000;DB.students.forEach(s=>{if(s.code>mx)mx=s.code});DB.students.push(Object.assign({id:uid(),code:mx+1},rec));toast('تمت إضافة الطالب')}
    touch();closeModal();refresh();
  },
  group(f){
    const fd=new FormData(f),id=+f.dataset.id,v=Object.fromEntries(fd),days=fd.getAll('d').map(Number);
    if(!v.name.trim()){toast('اكتب اسم المجموعة','bad');return}
    const rec={name:v.name.trim(),grade:v.grade.trim(),fee:+v.fee||0,time:v.time||'16:00',days};
    if(id){Object.assign(idx().g.get(id),rec);toast('تم تحديث المجموعة')}
    else{DB.groups.push(Object.assign({id:uid()},rec));toast('تمت إضافة المجموعة')}
    touch();closeModal();refresh();
  },
  pay(f){
    const v=Object.fromEntries(new FormData(f));
    if(!(+v.amount>0)){toast('اكتب مبلغ صحيح','bad');return}
    addPayment(+f.dataset.sid,f.dataset.m,+v.amount,v.date,v.note.trim());
    toast('تم تسجيل الدفعة');closeModal();
    const n=currentName();if(n==='payments')listPay();else refresh();
  },
  exam(f){
    const v=Object.fromEntries(new FormData(f)),id=+f.dataset.id;
    if(!v.title.trim()||!(+v.max>0)){toast('اكمل بيانات الامتحان','bad');return}
    if(id){const e=DB.exams.find(x=>x.id===id);e.title=v.title.trim();e.date=v.date;e.max=+v.max;for(const k in e.scores){if(e.scores[k]>e.max)e.scores[k]=e.max}}
    else{const e={id:uid(),gid:UI.gr.gid,title:v.title.trim(),date:v.date||todayStr(),max:+v.max,scores:{}};DB.exams.push(e);UI.gr.eid=e.id}
    touch();closeModal();toast('تم الحفظ');refresh();
  },
  settings(f){
    const v=Object.fromEntries(new FormData(f));
    DB.settings.center=v.center.trim()||'اسم السنتر';DB.settings.teacher=v.teacher.trim()||'الأستاذ';
    touch();toast('تم حفظ الإعدادات');render();
  }
};

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('ovl')){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t)});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.inp&&INP[t.dataset.inp]){clearTimeout(inpT);inpT=setTimeout(()=>INP[t.dataset.inp](t),160);return}
  if(t.dataset.score!==undefined){
    const ex=curExam();if(!ex)return;
    let raw=t.value;
    if(raw===''){delete ex.scores[t.dataset.score]}
    else{let v=parseFloat(raw);if(isNaN(v))return;if(v>ex.max){v=ex.max;t.value=v}if(v<0){v=0;t.value=v}ex.scores[t.dataset.score]=v}
    touch();
    const row=t.closest('tr');if(row)row.querySelector('.pct').innerHTML=pctChip(ex.scores[t.dataset.score],ex.max);
    const sts=idx().byGroup.get(UI.gr.gid)||[];
    $('#grStats').innerHTML=grStatsHtml(ex,sts);$('#grTop').innerHTML=grTopHtml(ex,sts);
  }
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();FORMS[f.dataset.form](f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#gs').addEventListener('keydown',e=>{
  if(e.key==='Enter'){UI.students.q=e.target.value;UI.students.gid=0;UI.students.pay='';UI.students.page=1;e.target.value='';go('students')}
});
window.addEventListener('hashchange',render);

/* ============ تشغيل ============ */
$('.burger').innerHTML=ico('menu',18);
(function(){const d=new Date();$('#todayLbl').textContent=DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()})();
render();
</script>
</body>
